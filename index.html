<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pokeball Gacha Shop</title>
<style>
  :root{
    --bg: #F7EFE4;
    --card-bg: #FFFFFF;
    --cream: #FFF6E9;
    --yellow: #F6C445;
    --yellow-dark: #E8AE1F;
    --pink: #F45C7A;
    --pink-soft: #FDE7EC;
    --purple-text: #2E2A3D;
    --gray-text: #9C93A6;
    --border: #F0E4D2;
    --blue: #4C6FEA;
    --green-bg:#DFF3E4; --green-text:#3C9A57;
    --radius: 18px;
    --radius-lg: 26px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--purple-text);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
       position:relative;padding-bottom:86px;}

  /* ---------- header ---------- */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;background:var(--cream);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;cursor:pointer;}
  .pokeball-icon{width:34px;height:34px;flex-shrink:0;}
  .top-actions{display:flex;align-items:center;gap:8px;}
  .pill-btn{
    border:1.5px solid var(--blue);color:var(--blue);background:#fff;
    border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .coin-badge{
    display:flex;align-items:center;gap:6px;background:var(--yellow);
    border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;color:#5A4200;
  }
  .coin-dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3C4,#F0B429 70%);display:inline-block;}

  main{padding:16px;}

  /* ---------- generic ---------- */
  .hidden{display:none !important;}
  .btn{
    border:none;border-radius:999px;padding:14px;font-weight:800;font-size:15px;
    cursor:pointer;width:100%;text-align:center;
  }
  .btn-yellow{background:var(--yellow);color:#4A3600;}
  .btn-yellow:active{background:var(--yellow-dark);}
  .btn-outline-blue{background:#fff;border:2px solid var(--blue);color:var(--blue);}
  .btn-pink{background:var(--pink-soft);color:var(--pink);}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--purple-text);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .card-panel{background:#fff;border-radius:var(--radius-lg);padding:18px;border:1px solid var(--border);}
  .muted{color:var(--gray-text);}
  .small{font-size:12.5px;}
  input, textarea, select{
    width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);
    background:#fff;font-size:14.5px;font-family:inherit;color:var(--purple-text);
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--yellow);}
  label.field-label{display:block;font-size:13.5px;color:var(--gray-text);margin:14px 0 6px;font-weight:700;}
  h2.section-title{font-size:20px;font-weight:800;margin:22px 0 12px;}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:#2E2A3D;color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;
    z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;}

  /* ---------- bottom nav ---------- */
  nav.bottom-nav{
    position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
    background:#fff;border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:10px 4px 14px;z-index:30;
  }
  nav.bottom-nav .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--gray-text);font-size:11.5px;font-weight:700;cursor:pointer;flex:1;
  }
  nav.bottom-nav .nav-item.active{color:var(--blue);}
  nav.bottom-nav svg{width:24px;height:24px;}

  /* ---------- login ---------- */
  .login-wrap{padding:60px 26px;text-align:center;}
  .login-logo{width:70px;height:70px;margin:0 auto 18px;}
  .login-wrap h1{font-size:24px;margin:0 0 4px;}
  .login-wrap .sub{color:var(--gray-text);font-size:14px;margin-bottom:32px;}
  .login-wrap .foot-note{margin-top:16px;color:var(--gray-text);font-size:12.5px;}
  .login-wrap a{color:#3AA0E8;font-weight:700;text-decoration:none;}

  /* ---------- home banner ---------- */
  .banner{
    background:linear-gradient(180deg,#FFF6E4,#FDECC9);border-radius:var(--radius-lg);
    padding:26px 22px;border:1px solid #F3DFA9;
  }
  .banner .tag{color:#3AA0E8;font-weight:800;font-size:14px;}
  .banner h1{font-size:27px;line-height:1.3;margin:10px 0 12px;font-weight:800;}
  .banner p.desc{color:#B39A6B;font-size:13.5px;line-height:1.6;margin-bottom:18px;}

  .notice-bar{
    display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);
    border-radius:16px;padding:14px 16px;margin-top:16px;cursor:pointer;
  }
  .urgent-chip{background:var(--pink);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 10px;flex-shrink:0;}
  .notice-bar .txt{flex:1;font-weight:700;font-size:14.5px;}

  .pack-hero{
    margin-top:8px;border-radius:22px;overflow:hidden;border:1px solid var(--border);
    background:linear-gradient(135deg,#F6C445,#F0902E);position:relative;min-height:180px;
    display:flex;align-items:center;justify-content:center;
  }
  .pack-hero img{width:100%;display:block;object-fit:cover;}
  .pack-hero .placeholder{color:#fff;text-align:center;padding:30px;font-weight:700;opacity:.85;}

  .draw-bar{display:flex;gap:10px;margin-top:14px;}
  .draw-opt{
    flex:1;background:#fff;border:1.5px solid var(--border);border-radius:16px;
    padding:12px 6px;text-align:center;cursor:pointer;
  }
  .draw-opt.active{background:var(--yellow);border-color:var(--yellow-dark);}
  .draw-opt .lbl{font-weight:800;font-size:13.5px;}
  .draw-opt .price{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:6px;font-weight:800;font-size:14px;}

  /* ---------- card grid ---------- */
  .card-list-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px;}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .prod-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;}
  .prod-card .thumb{
    aspect-ratio:3/4;background:linear-gradient(160deg,#EFE6F7,#F7E7ED);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  }
  .prod-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .prod-card .thumb .ph-icon{width:40%;opacity:.35;}
  .prod-card .soldout-badge{
    position:absolute;inset:0;background:rgba(60,55,70,.55);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  }
  .prod-card .info{padding:10px 12px 14px;}
  .prod-card .name{font-weight:700;font-size:13.5px;line-height:1.35;min-height:36px;}
  .grade-chip{
    display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;margin-top:8px;
  }
  .grade-N{background:#EFEFEF;color:#888;}
  .grade-R{background:#E3F2E5;color:#3C9A57;}
  .grade-SR{background:#E4EBFB;color:#4C6FEA;}
  .grade-SSR{background:#F5E4FB;color:#9A4CD8;}
  .grade-UR{background:#FCEFD9;color:#C98A1F;}
  .prod-card .rate{color:var(--gray-text);font-size:12px;margin-top:4px;}

  /* ---------- storage ---------- */
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .filter-chip{
    flex-shrink:0;padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);
    background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--purple-text);
  }
  .filter-chip.active{background:var(--yellow);border-color:var(--yellow-dark);}
  .inv-item{
    background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;margin-top:14px;
    display:flex;gap:14px;
  }
  .inv-thumb{
    width:74px;height:96px;border-radius:12px;flex-shrink:0;overflow:hidden;
    background:linear-gradient(160deg,#333,#111);display:flex;align-items:center;justify-content:center;
  }
  .inv-thumb img{width:100%;height:100%;object-fit:cover;}
  .inv-body{flex:1;min-width:0;}
  .inv-body .top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .inv-body .name{font-weight:800;font-size:15px;}
  .new-chip{background:#FDECC9;color:#C98A1F;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .inv-body .meta{color:var(--gray-text);font-size:12.5px;margin-top:4px;}
  .inv-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .tiny-btn{
    border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;border:1.5px solid var(--border);
    background:#fff;cursor:pointer;color:var(--purple-text);
  }
  .tiny-btn.pink{border-color:#FBD3DD;background:var(--pink-soft);color:var(--pink);}
  .tiny-btn.green{border:none;background:var(--green-bg);color:var(--green-text);}
  .tiny-btn.active-fav{background:#FFF1CF;border-color:var(--yellow-dark);}

  /* ---------- history ---------- */
  .hist-item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-top:10px;
    display:flex;justify-content:space-between;align-items:center;}
  .hist-item .name{font-weight:700;font-size:14px;}
  .hist-item .date{color:var(--gray-text);font-size:12px;margin-top:3px;}

  /* ---------- empty state ---------- */
  .empty-state{text-align:center;padding:60px 20px;color:var(--gray-text);}
  .empty-state svg{width:52px;height:52px;opacity:.4;margin-bottom:10px;}

  /* ---------- profile ---------- */
  .profile-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .k{color:var(--gray-text);font-size:13.5px;}
  .profile-row .v{font-weight:800;font-size:15px;}

  /* ---------- admin ---------- */
  .admin-tab-row{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border:1px solid var(--border);
    border-radius:20px;padding:14px;margin-bottom:18px;}
  .admin-tab{padding:9px 15px;border-radius:999px;border:none;background:var(--cream);
    font-weight:700;font-size:13px;cursor:pointer;color:var(--purple-text);}
  .admin-tab.active{background:var(--yellow);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;}
  .stat-card .num{font-size:26px;font-weight:800;}
  .stat-card .lbl{color:var(--gray-text);font-size:12.5px;margin-top:4px;}
  table.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;
    border:1px solid var(--border);}
  table.admin-table th{background:var(--cream);text-align:left;padding:10px 12px;font-size:12px;color:var(--gray-text);}
  table.admin-table td{padding:10px 12px;font-size:13px;border-top:1px solid var(--border);vertical-align:middle;}
  .role-badge{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;}
  .role-admin{background:#FDECC9;color:#C98A1F;}
  .role-user{background:#EFEFEF;color:#888;}
  .admin-card-form{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px;}
  .admin-card-form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .thumb-upload{
    width:100%;aspect-ratio:3/4;border-radius:14px;border:1.5px dashed var(--border);
    background:var(--cream);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:6px;color:var(--gray-text);font-size:12.5px;cursor:pointer;overflow:hidden;position:relative;
  }
  .thumb-upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .cardpack-edit-item{display:flex;gap:12px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:10px;align-items:center;}
  .cardpack-edit-item .mini-thumb{width:52px;height:68px;border-radius:8px;background:#eee;flex-shrink:0;overflow:hidden;}
  .cardpack-edit-item .mini-thumb img{width:100%;height:100%;object-fit:cover;}
  .cardpack-edit-item .body{flex:1;min-width:0;}
  .cardpack-edit-item .body .n{font-weight:700;font-size:13.5px;}
  .banner-close{float:right;font-size:22px;color:var(--gray-text);cursor:pointer;line-height:1;}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(30,25,40,.55);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;}
  .modal-bg.center{align-items:center;}
  .modal-box{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:24px 20px 28px;
    max-height:85vh;overflow-y:auto;}
  .modal-bg.center .modal-box{border-radius:24px;max-width:340px;text-align:center;}
  .modal-box h3{margin:0 0 14px;font-size:18px;}
  .gacha-result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
  .gacha-result-card{background:var(--cream);border-radius:12px;padding:8px;text-align:center;}
  .gacha-result-card .rthumb{width:100%;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#ddd;margin-bottom:6px;}
  .gacha-result-card .rthumb img{width:100%;height:100%;object-fit:cover;}
  .gacha-result-card .rname{font-size:11px;font-weight:700;line-height:1.2;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Pokeball Gacha Shop - single-file demo app
   Data persists in localStorage (client-side only demo).
   ========================================================= */

const DB_KEY = 'pgs_db_v1';
const POKEBALL_SVG = `<svg viewBox="0 0 100 100" class="pokeball-icon"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#2E2A3D" stroke-width="6"/><path d="M4 50a46 46 0 0 1 92 0z" fill="#F45C7A"/><rect x="4" y="47" width="92" height="6" fill="#2E2A3D"/><circle cx="50" cy="50" r="14" fill="#fff" stroke="#2E2A3D" stroke-width="6"/></svg>`;
const PH_ICON_SVG = `<svg class="ph-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="6"/><path d="M4 50a46 46 0 0 1 92 0z" fill="#fff"/><rect x="4" y="47" width="92" height="6" fill="#fff"/><circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-width="6"/></svg>`;

const GRADES = ['N','R','SR','SSR','UR'];
const GRADE_SELL = {N:10, R:30, SR:120, SSR:400, UR:1500};

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  let h = d.getHours(); const ap = h<12 ? '오전':'오후'; h = h%12; if(h===0) h=12;
  return `${d.getFullYear()}. ${p(d.getMonth()+1)}. ${p(d.getDate())}. ${ap} ${p(h)}:${p(d.getMinutes())}`;
}

function defaultDB(){
  const adminId = uid('u');
  return {
    session: null, // userId currently logged in
    users: [
      { id: adminId, username:'박동범', password:'admin1234', nickname:'박동범',
        coins: 5000, isAdmin: true, joinedAt: nowISO() }
    ],
    packs: [
      {
        id: uid('pack'), name:'포켓볼 일판 가챠팩', active:true, heroImage:null,
        priceOne: 300, priceFive: 1350, priceTen: 2700,
        cards: [
          {id:uid('c'), name:'이브이 일러 일판', grade:'UR', rate:0.04, image:null, soldOut:false},
          {id:uid('c'), name:'리오르 일러 일판', grade:'UR', rate:0.06, image:null, soldOut:false},
          {id:uid('c'), name:'이슬이와 아쿠스타 일판', grade:'UR', rate:0.06, image:null, soldOut:false},
          {id:uid('c'), name:'리자몽 더블레어 일판', grade:'UR', rate:0.17, image:null, soldOut:false},
          {id:uid('c'), name:'릴삐삐 스일레 최고급', grade:'UR', rate:0.33, image:null, soldOut:true},
          {id:uid('c'), name:'다크라이 스일레 최고급', grade:'UR', rate:0.34, image:null, soldOut:true},
          {id:uid('c'), name:'파이리 일러 랜덤', grade:'SSR', rate:2.0, image:null, soldOut:false},
          {id:uid('c'), name:'꼬부기 일러 랜덤', grade:'SSR', rate:2.0, image:null, soldOut:false},
          {id:uid('c'), name:'중간 등급 랜덤', grade:'R', rate:20.0, image:null, soldOut:false},
          {id:uid('c'), name:'중간 등급 랜덤 B', grade:'R', rate:25.0, image:null, soldOut:false},
          {id:uid('c'), name:'낮음 등급 랜덤', grade:'N', rate:50.0, image:null, soldOut:false},
        ]
      }
    ],
    notice: { title:'[필독] 가챠 안내',
      body:'본 서비스는 디스코드 커뮤니티 활동으로 지급되는 코인으로만 이용할 수 있는 가상 컬렉션 서비스입니다. 실제 현금 거래는 지원하지 않습니다.' },
    inventory: [],     // {id,userId,cardId,packId,name,grade,image,obtainedAt,favorite,locked,claimStatus}
    history: [],        // {id,userId,name,grade,createdAt}
    chargeRequests: [], // {id,userId,discordId,amount,memo,status,createdAt}
    auditLog: []
  };
}

let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const fresh = defaultDB();
  localStorage.setItem(DB_KEY, JSON.stringify(fresh));
  return fresh;
}
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function log(action){ DB.auditLog.unshift({id:uid('log'), action, at:nowISO()}); if(DB.auditLog.length>200) DB.auditLog.pop(); }

function currentUser(){ return DB.users.find(u=>u.id===DB.session) || null; }
function isAdmin(){ const u=currentUser(); return !!(u && u.isAdmin); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- router ---------------- */
let view = 'home';      // home | storage | history | charge | profile | admin
let adminTab = 'dashboard';
let storageFilter = '전체';
let drawCount = 1;
let activePackId = null;

function nav(v){ view = v; render(); window.scrollTo(0,0); }

function render(){
  const app = document.getElementById('app');
  const u = currentUser();
  if(!u){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if(!activePackId && DB.packs[0]) activePackId = DB.packs[0].id;

  let body = '';
  if(view==='home') body = renderHome();
  else if(view==='storage') body = renderStorage();
  else if(view==='history') body = renderHistory();
  else if(view==='charge') body = renderCharge();
  else if(view==='profile') body = renderProfile();
  else if(view==='admin' && isAdmin()) body = renderAdmin();
  else body = renderHome();

  app.innerHTML = `
    ${renderHeader()}
    <main>${body}</main>
    ${renderBottomNav()}
  `;
  attachCommonEvents();
}

/* ---------------- header / nav ---------------- */
function renderHeader(){
  const u = currentUser();
  return `
  <header class="topbar">
    <div class="brand" data-nav="home">${POKEBALL_SVG}<span>Pokeball Gacha Shop</span></div>
    <div class="top-actions">
      ${isAdmin() ? `<button class="pill-btn" data-nav="admin">관리자</button>` : ``}
      <div class="coin-badge"><span class="coin-dot"></span>${u.coins.toLocaleString()}</div>
    </div>
  </header>`;
}
function navIcon(name, path){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
function renderBottomNav(){
  const items = [
    {v:'home', label:'홈', icon:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'},
    {v:'storage', label:'보관함', icon:'<rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/>'},
    {v:'history', label:'이력', icon:'<path d="M6 3h9l5 5v13H6z"/><path d="M9 12h6M9 16h6"/>'},
    {v:'charge', label:'충전', icon:'<circle cx="8" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>'},
    {v:'profile', label:'프로필', icon:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>'}
  ];
  return `<nav class="bottom-nav">

    $('#do-login').onclick = ()=>{

    $('#do-signup').onclick = ()=>{
      const id=$('#su-id').value.trim(), nick=$('#su-nick').value.trim(), pw=$('#su-pw').value;
      if(!id||!nick||!pw){ toast('모든 항목을 입력해주세요.'); return; }
      if(DB.users.some(u=>u.username===id)){ toast('이미 사용중인 아이디입니다.'); return; }
      const isFirst = DB.users.length===0;
      const nu = { id:uid('u'), username:id, password:pw, nickname:nick, coins:0, isAdmin:isFirst, joinedAt:nowISO() };
      DB.users.push(nu); DB.session = nu.id; save();
      toast('회원가입 완료!'); authMode='login'; view='home'; render();
    };
  }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function doPull(){
  const pack = DB.packs.find(p=>p.id===activePackId);
  if(!pack) return;
  const priceMap = {1:pack.priceOne, 5:pack.priceFive, 10:pack.priceTen};
  const cost = priceMap[drawCount];
  const u = currentUser();
  if(u.coins < cost){ toast('코인이 부족합니다. 충전 후 이용해주세요.'); return; }
  const pool = pack.cards.filter(c=>!c.soldOut);
  if(pool.length===0){ toast('현재 뽑을 수 있는 카드가 없습니다.'); return; }
  u.coins -= cost;
  const results = [];
  for(let i=0;i<drawCount;i++){
    const total = pool.reduce((s,c)=>s+Number(c.rate),0);
    let r = Math.random()*total, picked = pool[pool.length-1];
    for(const c of pool){ if(r < c.rate){ picked = c; break; } r -= c.rate; }
    results.push(picked);
    const invItem = { id:uid('inv'), userId:u.id, cardId:picked.id, packId:pack.id,
      name:picked.name, grade:picked.grade, image:picked.image, obtainedAt:nowISO(),
      favorite:false, locked:false, claimStatus:'none' };
    DB.inventory.unshift(invItem);
    DB.history.unshift({id:uid('h'), userId:u.id, name:picked.name, grade:picked.grade, createdAt:nowISO()});
  }
  log(`${u.nickname}님이 ${pack.name}에서 ${drawCount}회 뽑기 (-${cost}코인)`);
  save();
  showResultModal(results);
}

function showResultModal(results){
  const html = `
  <div class="modal-bg" id="result-modal">
    <div class="modal-box">
      <h3>🎉 뽑기 결과</h3>
      <div class="gacha-result-grid">
        ${results.map(c=>`
          <div class="gacha-result-card">
            <div class="rthumb">${c.image?`<img src="${c.image}">`:''}</div>
            <div class="rname">${escapeHtml(c.name)}</div>
            <span class="grade-chip grade-${c.grade}" style="margin-top:4px">${c.grade}</span>
          </div>`).join('')}
      </div>
      <button class="btn btn-yellow" id="close-result">확인</button>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('close-result').onclick = ()=>{
    document.getElementById('result-modal').remove(); render();
  };
}

            <input type="file" accept="image/*" class="hidden" data-card-image="${pack.id}|${c.id}">
          </label>
          <div class="body">
            <input class="n" style="border:none;padding:4px 0;font-weight:700" value="${escapeHtml(c.name)}" data-card-name="${pack.id}|${c.id}">
            <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
              <select style="width:76px;padding:6px" data-card-grade="${pack.id}|${c.id}">
                ${GRADES.map(g=>`<option ${c.grade===g?'selected':''}>${g}</option>`).join('')}
              </select>
              <input type="number" step="0.01" style="width:70px;padding:6px" value="${c.rate}" data-card-rate="${pack.id}|${c.id}">
              <label style="display:flex;align-items:center;gap:4px;font-size:12.5px">
                <input type="checkbox" style="width:auto" ${c.soldOut?'checked':''} data-card-soldout="${pack.id}|${c.id}"> 품절
              </label>
              <button class="tiny-btn pink" data-remove-card="${pack.id}|${c.id}">삭제</button>
            </div>
          </div>
        </div>`).join('')}
    </div>
  `).join('') + `<button class="btn btn-outline-blue" style="margin-top:14px" id="add-pack">+ 새 카드팩 추가</button>`;
}

function renderAdminCharge(){
  const list = [...DB.chargeRequests].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return list.length===0 ? `<div class="empty-state">충전 요청이 없습니다.</div>` : list.map(r=>{
    const u = DB.users.find(x=>x.id===r.userId);
    return `
    <div class="inv-item">
      <div class="inv-body">
        <div class="top-row"><span class="name">${escapeHtml(u?u.nickname:'알수없음')} · ${r.amount.toLocaleString()} 코인</span></div>
        <div class="meta">디스코드: ${escapeHtml(r.discordId)} ${r.memo?(' · '+escapeHtml(r.memo)):''}</div>
        <div class="meta">${fmtDate(r.createdAt)}</div>
        <div class="inv-actions">
          ${r.status==='pending' ? `
            <div class="tiny-btn green" data-charge-approve="${r.id}">승인</div>
            <div class="tiny-btn pink" data-charge-reject="${r.id}">반려</div>` :
            `<span class="role-badge ${r.status==='approved'?'role-admin':'role-user'}">${r.status==='approved'?'승인 완료':'반려됨'}</span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderAdminClaims(){
  const list = DB.inventory.filter(i=>i.claimStatus!=='none');
  if(list.length===0) return `<div class="empty-state">수령 신청 내역이 없습니다.</div>`;
  return list.map(it=>{
    const u = DB.users.find(x=>x.id===it.userId);
    return `
    <div class="inv-item">
      <div class="inv-thumb">${it.image?`<img src="${it.image}">`:''}</div>
      <div class="inv-body">
        <div class="top-row"><span class="name">${escapeHtml(it.name)}</span><span class="grade-chip grade-${it.grade}">${it.grade}</span></div>
        <div class="meta">신청자: ${escapeHtml(u?u.nickname:'?')} · ${fmtDate(it.obtainedAt)}</div>
        <div class="inv-actions">
          ${it.claimStatus==='pending' ? `<div class="tiny-btn green" data-claim-approve="${it.id}">수령 승인</div>` :
            `<span class="role-badge role-admin">수령 완료</span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderAdminNotice(){
  return `
  <div class="admin-card-form">
    <label class="field-label" style="margin-top:0">공지 제목</label>
    <input id="notice-title" value="${escapeHtml(DB.notice.title)}">
    <label class="field-label">공지 내용</label>
    <textarea id="notice-body" rows="5">${escapeHtml(DB.notice.body)}</textarea>
    <div style="margin-top:14px"></div>
    <button class="btn btn-yellow" id="save-notice">공지 저장</button>
  </div>`;
}

function renderAdminAudit(){
  if(DB.auditLog.length===0) return `<div class="empty-state">기록이 없습니다.</div>`;
  return DB.auditLog.slice(0,80).map(l=>`
    <div class="hist-item"><div><div class="name">${escapeHtml(l.action)}</div><div class="date">${fmtDate(l.at)}</div></div></div>`).join('');
}

/* ---------------- events ---------------- */
function fileToDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = ()=>cb(reader.result);
  reader.readAsDataURL(file);
}

function attachCommonEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> nav(el.getAttribute('data-nav')));
  });

  const $ = s => document.querySelector(s);

  if(view==='home'){
    document.querySelectorAll('[data-draw]').forEach(el=>{
      el.addEventListener('click', ()=>{ drawCount = Number(el.getAttribute('data-draw')); render(); });
    });
    const pull = document.getElementById('do-pull');
    if(pull) pull.addEventListener('click', doPull);
    const nb = document.getElementById('open-notice');
    if(nb) nb.addEventListener('click', ()=>{
      document.body.insertAdjacentHTML('beforeend', `
      <div class="modal-bg center" id="notice-modal">
        <div class="modal-box">
          <span class="banner-close" id="close-notice">×</span>
          <h3>${escapeHtml(DB.notice.title)}</h3>
          <p style="text-align:left;font-size:14px;line-height:1.6;color:#5A5566">${escapeHtml(DB.notice.body)}</p>
          <button class="btn btn-yellow" id="close-notice2">확인</button>
        </div>
      </div>`);
      const close = ()=>document.getElementById('notice-modal').remove();
      document.getElementById('close-notice').onclick = close;
      document.getElementById('close-notice2').onclick = close;
    });
  }

  if(view==='storage'){
    document.querySelectorAll('[data-filter]').forEach(el=>{
      el.addEventListener('click', ()=>{ storageFilter = el.getAttribute('data-filter'); render(); });
    });
    document.querySelectorAll('[data-inv-fav]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const it = DB.inventory.find(i=>i.id===el.getAttribute('data-inv-fav'));
        it.favorite = !it.favorite; save(); render();
      });
    });
    document.querySelectorAll('[data-inv-lock]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const it = DB.inventory.find(i=>i.id===el.getAttribute('data-inv-lock'));
        it.locked = !it.locked; save(); render();
      });
    });
    document.querySelectorAll('[data-inv-sell]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-inv-sell');
        const it = DB.inventory.find(i=>i.id===id);
        if(it.locked){ toast('잠긴 카드는 판매할 수 없습니다.'); return; }
        const price = GRADE_SELL[it.grade]||0;
        const u = currentUser(); u.coins += price;
        DB.inventory = DB.inventory.filter(i=>i.id!==id);
        log(`${u.nickname}님이 ${it.name} 즉시판매 (+${price}코인)`);
        save(); toast(`${price}코인에 판매되었습니다.`); render();
      });
    });
    document.querySelectorAll('[data-inv-claim]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const it = DB.inventory.find(i=>i.id===el.getAttribute('data-inv-claim'));
        it.claimStatus = 'pending'; save(); toast('수령 신청이 접수되었습니다.'); render();
      });
    });
  }

  if(view==='charge'){
    const btn = document.getElementById('do-charge');
    if(btn) btn.addEventListener('click', ()=>{
      const discord = $('#ch-discord').value.trim();
      const amount = Number($('#ch-amount').value);
      const memo = $('#ch-memo').value.trim();
      if(!discord || !amount){ toast('디스코드 아이디와 수량을 입력해주세요.'); return; }
      DB.chargeRequests.unshift({id:uid('cr'), userId:currentUser().id, discordId:discord, amount, memo, status:'pending', createdAt:nowISO()});
      save(); toast('충전 요청을 보냈습니다.'); render();
    });
  }

  if(view==='profile'){
    document.getElementById('pf-save').addEventListener('click', ()=>{
      const v = $('#pf-nick').value.trim();
      if(!v){ toast('닉네임을 입력해주세요.'); return; }
      currentUser().nickname = v; save(); toast('변경사항이 저장되었습니다.'); render();
    });
    document.getElementById('pf-logout').addEventListener('click', ()=>{
      DB.session = null; save(); render();
    });
  }

  if(view==='admin'){
    document.querySelectorAll('[data-admin-tab]').forEach(el=>{
      el.addEventListener('click', ()=>{ adminTab = el.getAttribute('data-admin-tab'); render(); });
    });

    if(adminTab==='users'){
      document.querySelectorAll('[data-toggle-admin]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const id = el.getAttribute('data-toggle-admin');
          const u = DB.users.find(x=>x.id===id);
          if(u.id===currentUser().id && u.isAdmin){ toast('본인의 관리자 권한은 해제할 수 없습니다.'); return; }
          u.isAdmin = !u.isAdmin; log(`${u.nickname} 관리자 권한 ${u.isAdmin?'지정':'해제'}`); save(); render();
        });
      });
      document.querySelectorAll('[data-coin-save]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const id = el.getAttribute('data-coin-save');
          const input = document.querySelector(`[data-coin-input="${id}"]`);
          const u = DB.users.find(x=>x.id===id);
          u.coins = Math.max(0, Number(input.value)||0);
          log(`${u.nickname} 코인 ${u.coins}로 수정`); save(); toast('코인이 수정되었습니다.'); render();
        });
      });
    }

    if(adminTab==='packs'){
      document.querySelectorAll('[data-pack-name]').forEach(el=>el.addEventListener('change', ()=>{
        DB.packs.find(p=>p.id===el.getAttribute('data-pack-name')).name = el.value; save();
      }));
      document.querySelectorAll('[data-pack-active]').forEach(el=>el.addEventListener('change', ()=>{
        DB.packs.find(p=>p.id===el.getAttribute('data-pack-active')).active = el.value==='1'; save();
      }));
      document.querySelectorAll('[data-pack-price1]').forEach(el=>el.addEventListener('change', ()=>{
        DB.packs.find(p=>p.id===el.getAttribute('data-pack-price1')).priceOne = Number(el.value)||0; save();
      }));
      document.querySelectorAll('[data-pack-price5]').forEach(el=>el.addEventListener('change', ()=>{
        DB.packs.find(p=>p.id===el.getAttribute('data-pack-price5')).priceFive = Number(el.value)||0; save();
      }));
      document.querySelectorAll('[data-pack-price10]').forEach(el=>el.addEventListener('change', ()=>{
        DB.packs.find(p=>p.id===el.getAttribute('data-pack-price10')).priceTen = Number(el.value)||0; save();
      }));
      document.querySelectorAll('[data-pack-hero]').forEach(el=>el.addEventListener('change', ()=>{
        const f = el.files[0]; if(!f) return;
        fileToDataUrl(f, url=>{
          DB.packs.find(p=>p.id===el.getAttribute('data-pack-hero')).heroImage = url; save(); render();
        });
      }));
      document.querySelectorAll('[data-card-image]').forEach(el=>el.addEventListener('change', ()=>{
        const [packId,cardId] = el.getAttribute('data-card-image').split('|');
        const f = el.files[0]; if(!f) return;
        fileToDataUrl(f, url=>{
          const pack = DB.packs.find(p=>p.id===packId);
          pack.cards.find(c=>c.id===cardId).image = url; save(); render();
        });
      }));
      document.querySelectorAll('[data-card-name]').forEach(el=>el.addEventListener('change', ()=>{
        const [packId,cardId] = el.getAttribute('data-card-name').split('|');
        DB.packs.find(p=>p.id===packId).cards.find(c=>c.id===cardId).name = el.value; save();
      }));
      document.querySelectorAll('[data-card-grade]').forEach(el=>el.addEventListener('change', ()=>{
        const [packId,cardId] = el.getAttribute('data-card-grade').split('|');
        DB.packs.find(p=>p.id===packId).cards.find(c=>c.id===cardId).grade = el.value; save(); render();
      }));
      document.querySelectorAll('[data-card-rate]').forEach(el=>el.addEventListener('change', ()=>{
        const [packId,cardId] = el.getAttribute('data-card-rate').split('|');
        DB.packs.find(p=>p.id===packId).cards.find(c=>c.id===cardId).rate = Number(el.value)||0; save();
      }));
      document.querySelectorAll('[data-card-soldout]').forEach(el=>el.addEventListener('change', ()=>{
        const [packId,cardId] = el.getAttribute('data-card-soldout').split('|');
        DB.packs.find(p=>p.id===packId).cards.find(c=>c.id===cardId).soldOut = el.checked; save();
      }));
      document.querySelectorAll('[data-remove-card]').forEach(el=>el.addEventListener('click', ()=>{
        const [packId,cardId] = el.getAttribute('data-remove-card').split('|');
        const pack = DB.packs.find(p=>p.id===packId);
        pack.cards = pack.cards.filter(c=>c.id!==cardId); save(); render();
      }));
      document.querySelectorAll('[data-add-card]').forEach(el=>el.addEventListener('click', ()=>{
        const pack = DB.packs.find(p=>p.id===el.getAttribute('data-add-card'));
        pack.cards.push({id:uid('c'), name:'새 카드', grade:'N', rate:1, image:null, soldOut:false});
        save(); render();
      }));
      const addPack = document.getElementById('add-pack');
      if(addPack) addPack.addEventListener('click', ()=>{
        DB.packs.push({id:uid('pack'), name:'새 카드팩', active:true, heroImage:null,
          priceOne:300, priceFive:1350, priceTen:2700, cards:[]});
        save(); render();
      });
    }

    if(adminTab==='charge'){
      document.querySelectorAll('[data-charge-approve]').forEach(el=>el.addEventListener('click', ()=>{
        const r = DB.chargeRequests.find(x=>x.id===el.getAttribute('data-charge-approve'));
        r.status = 'approved';
        const u = DB.users.find(x=>x.id===r.userId);
        if(u){ u.coins += r.amount; }
        log(`충전 요청 승인: ${u?u.nickname:'?'} +${r.amount}`); save(); toast('충전을 승인했습니다.'); render();
      }));
      document.querySelectorAll('[data-charge-reject]').forEach(el=>el.addEventListener('click', ()=>{
        const r = DB.chargeRequests.find(x=>x.id===el.getAttribute('data-charge-reject'));
        r.status = 'rejected'; save(); render();
      }));
    }

    if(adminTab==='claims'){
      document.querySelectorAll('[data-claim-approve]').forEach(el=>el.addEventListener('click', ()=>{
        const it = DB.inventory.find(x=>x.id===el.getAttribute('data-claim-approve'));
        it.claimStatus = 'approved'; log(`수령 승인: ${it.name}`); save(); render();
      }));
    }

    if(adminTab==='notice'){
      const btn = document.getElementById('save-notice');
      if(btn) btn.addEventListener('click', ()=>{
        DB.notice.title = document.getElementById('notice-title').value;
        DB.notice.body = document.getElementById('notice-body').value;
        save(); toast('공지가 저장되었습니다.'); render();
      });
    }
  }
}

render();
</script>
</body>
</html>
